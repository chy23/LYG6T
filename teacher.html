<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="google" content="notranslate">
  <title>麗園國小 115學年度六年級戶外教育手冊【教師專用版】</title>
  <meta name="description" content="新北市林口區麗園國民小學 115學年度六年級戶外教育參觀活動電子手冊【教師專用版】，含全冊行程導覽、學生房間表與晚點名查房管理。">
  <link rel="stylesheet" href="css/style.css?v=20261026_0350">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍎</text></svg>">
</head>
<body>

  <!-- Top Sticky Navigation Bar -->
  <header class="book-header" style="background: rgba(15, 23, 42, 0.98); border-bottom: 2px solid #f59e0b;">
    <div class="header-inner">
      <div class="book-title-group">
        <span class="school-tag" style="background:#ea580c; color:white;">🍎 教師專用版</span>
        <div class="book-main-title">
          <span>六年級戶外教育 (教師版)</span>
        </div>
      </div>

      <div class="header-controls">
        <!-- 一鍵直達最後一頁房桌號表 -->
        <button class="header-btn" id="btnOpenRooms" onclick="goToPage(pagesContent.length)" style="background:linear-gradient(135deg, #f59e0b, #d97706); color:#0f172a; font-weight:800; border:none; box-shadow:0 2px 8px rgba(245, 158, 11, 0.4);" title="直達手冊最後一頁：房桌號表與查房點名">
          <span>📋 房桌號表</span>
        </button>

        <!-- 字體放大縮小 -->
        <button class="header-btn font-size-btn" onclick="adjustFontSize(-0.1)" title="縮小字體">A-</button>
        <button class="header-btn font-size-btn" onclick="adjustFontSize(0.1)" title="放大字體">A+</button>

        <!-- 模式切換：連續滾動 / 單頁翻閱 -->
        <button class="header-btn" id="btnToggleLayout" title="切換閱覽模式：連續滾動 / 單頁翻閱">
          <span id="layoutModeText">📜 連續</span>
        </button>

        <button class="header-btn" id="btnOpenToc" title="開啟章節目錄">
          <span>📑 目錄</span>
        </button>
        <button class="header-btn" id="btnToggleScan" title="切換原版掃描 / 數位排版">
          <span id="scanModeText">📷 原版</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Book Main Stage -->
  <main class="book-stage">
    
    <!-- 頂部倒數與提示小條 -->
    <div class="book-info-bar">
      <div>
        <span style="color:#fdba74; font-weight:700;">⏳ 啟程倒數：</span>
        <span id="headerCountdown" style="font-weight:800; color:#38bdf8;">計算中...</span>
      </div>
      <div style="font-size:0.78rem; color:#94a3b8;">
        115/11/25 (三) 06:30 集合 07:00 準時出發！
      </div>
    </div>

    <!-- 教師專屬快捷橫幅 -->
    <div id="teacherPageNoticeBanner" class="teacher-notice-banner" style="margin-bottom:12px; background:linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%); border:2px solid #fcd34d; border-radius:12px; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; gap:10px; box-shadow:0 2px 8px rgba(245,158,11,0.12); width:100%; max-width:1260px; box-sizing:border-box;">
      <div style="display:flex; align-items:center; gap:10px;">
        <span style="font-size:1.4rem;">📋</span>
        <div>
          <b style="color:#92400e; font-size:0.92rem;">查房表已併入手冊最後一頁（第 22 頁）</b>
          <p style="margin:2px 0 0; font-size:0.78rem; color:#b45309;">含實體單 1~25 號男女房桌號對照表、601~609 班級切換、同房同桌米色色塊標註與夜間巡房打勾點名系統。</p>
        </div>
      </div>
      <button onclick="goToPage(pagesContent.length)" style="background:#d97706; color:white; border:none; padding:7px 14px; border-radius:20px; font-weight:700; font-size:0.82rem; cursor:pointer; white-space:nowrap; box-shadow:0 2px 6px rgba(217,119,6,0.3);">直達最後一頁 ➔</button>
    </div>

    <!-- Book Spine & Pages Container -->
    <div class="book-spine-wrapper" id="bookWrapper">
      <div class="book-spread" id="bookSpread">
        <!-- Left Page (Mobile shows active page here) -->
        <article class="book-page page-left" id="pageLeft"></article>
        <!-- Right Page (Desktop only) -->
        <article class="book-page page-right" id="pageRight"></article>
      </div>
    </div>

    <!-- Bottom Page Navigation Bar (Fixed on Mobile) -->
    <nav class="book-nav-bar">
      <button class="nav-arrow-btn" id="btnPrevPage">
        <span>◀ 上一頁</span>
      </button>

      <select class="page-jump-select" id="pageJumpSelect"></select>

      <button class="nav-arrow-btn" id="btnNextPage">
        <span>下一頁 ▶</span>
      </button>
    </nav>
  </main>

  <!-- Table of Contents Drawer (目錄側邊欄) -->
  <div class="toc-backdrop" id="tocBackdrop"></div>
  <aside class="toc-drawer" id="tocDrawer">
    <div class="toc-header">
      <h3><span>📖</span> 手冊章節目錄 (教師版)</h3>
      <button class="header-btn" id="btnCloseToc" style="padding:4px 10px;">✕</button>
    </div>
    <!-- 教師專用置頂快捷按鈕 -->
    <div style="padding:10px 14px; border-bottom:1px solid #e2e8f0; background:#fffbeb;">
      <button onclick="goToPage(pagesContent.length); document.getElementById('btnCloseToc').click();" style="width:100%; padding:10px; border-radius:8px; background:#f59e0b; color:#0f172a; font-weight:800; border:none; cursor:pointer; font-size:0.9rem; display:flex; align-items:center; justify-content:center; gap:6px;">
        <span>📋</span> 直達最後一頁：房桌號表與查房點名
      </button>
    </div>
    <div class="toc-list" id="tocList"></div>
  </aside>

  <!-- Scripts (確保順序：quiz-data ➔ pages-content ➔ teacher-rooms ➔ book-reader) -->
  <script src="js/quiz-data.js?v=20261026_0350"></script>
  <script src="js/pages-content.js?v=20261026_0350"></script>
  <script src="js/teacher-rooms.js?v=20261026_0350"></script>
  <script src="js/book-reader.js?v=20261026_0350"></script>
</body>
</html>
